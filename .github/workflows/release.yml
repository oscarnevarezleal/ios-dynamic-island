name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app for simulator
        run: |
          xcodebuild build \
            -project DynamicIslandDemo.xcodeproj \
            -scheme DynamicIslandDemo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Package build artifact
        run: |
          APP_PATH=$(find build -name "DynamicIslandDemo.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/DynamicIslandDemo-simulator-${{ steps.version.outputs.version }}.zip" DynamicIslandDemo.app
          echo "artifact_name=DynamicIslandDemo-simulator-${{ steps.version.outputs.version }}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandDemo-simulator-${{ steps.version.outputs.version }}
          path: ${{ env.artifact_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DynamicIslandDemo ${{ steps.version.outputs.tag }}
          body: |
            ## DynamicIslandDemo ${{ steps.version.outputs.tag }}

            iOS app demonstrating Dynamic Island with Live Activities using ActivityKit.

            ### Installation (Simulator)
            1. Unzip `DynamicIslandDemo-simulator-${{ steps.version.outputs.version }}.zip`
            2. Open Simulator and boot an iPhone 15 Pro (or later)
            3. Drag the `.app` onto the simulator window, or run:
               ```
               xcrun simctl install booted DynamicIslandDemo.app
               ```

            ### Requirements
            - iOS 17.0+
            - iPhone 14 Pro or later (for Dynamic Island hardware)
          files: ${{ env.artifact_name }}
          draft: false
          prerelease: false
