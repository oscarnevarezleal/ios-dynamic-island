name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DynamicIslandDemo
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build app
        run: |
          xcodebuild build \
            -project DynamicIslandDemo.xcodeproj \
            -scheme DynamicIslandDemo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Package simulator app
        run: |
          APP_PATH=$(find build -name "DynamicIslandDemo.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/DynamicIslandDemo-simulator.zip" DynamicIslandDemo.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandDemo-simulator
          path: DynamicIslandDemo-simulator.zip
          retention-days: 7
